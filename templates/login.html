<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Study Assistant — Login</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login-card"><div class="eyebrow">PRIVATE STUDY TOOL</div><h1>✨ Study Assistant</h1><p>Enter the password configured in Render to open your assistant.</p><form method="post" action="/login"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required autofocus><button type="submit">Unlock assistant</button></form>{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}</main></body></html>
